<script>
  (function () {
    var root = document.documentElement;
    var nav = document.querySelector('nav');
    var files = [].slice.call(document.querySelectorAll('.file'));
    if (!files.length) return;
    var ticking = false;

    function measure() {
      if (nav) root.style.setProperty('--nav-h', nav.offsetHeight + 'px');
    }

    function update() {
      ticking = false;
      var vh = window.innerHeight;
      var enter = files.map(function (li) {
        var top = parseFloat(getComputedStyle(li).top) || 0;
        var range = Math.max(1, vh - top);
        return Math.min(1, Math.max(0, (vh - li.getBoundingClientRect().top) / range));
      });
      files.forEach(function (li, i) {
        var next = i + 1 < enter.length ? enter[i + 1] : 0;
        li.style.setProperty('--e', enter[i].toFixed(3));
        li.style.setProperty('--c', Math.min(1, Math.max(0, (next - 0.85) / 0.15)).toFixed(3));
      });
    }

    function request() {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }

    measure();
    update();
    window.addEventListener('scroll', request, { passive: true });
    window.addEventListener('resize', function () { measure(); request(); });
  })();
</script>
